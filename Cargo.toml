[package]
name = "tontooui"
version = "26.1.0"
edition = "2021"
license = "TCL"
description = "SwiftUI-inspired declarative UI layer for TontooOS, built on top of TontooUIKit"
readme = "README.md"
keywords = ["tontoo", "ui", "swiftui", "declarative", "gtk4"]
categories = ["gui"]

[dependencies]
uikit = { path = "/Library/System/uikit" }
coreicon = { path = "/Library/System/coreicon", optional = true }
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
glib = "0.20"
cairo-rs = "0.20"
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["coreicon"]

[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
