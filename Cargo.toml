[package]
name = "tontooui"
version = "26.1.0"
edition = "2021"
license = "TCL"
description = "SwiftUI-inspired declarative UI layer for TontooOS"
readme = "README.md"
keywords = ["tontoo", "ui", "swiftui", "declarative"]
categories = ["gui"]

[dependencies]
winit = "0.30"
wgpu = "29"
vello = "0.10"
futures = "0.3"
coreimage = { package = "coreimage", path = "../CoreImage" }
# Layer-shell backend (shell bars like the menubar): Wayland only.
smithay-client-toolkit = "0.19"
wayland-client = { version = "0.31", features = ["system"] }
raw-window-handle = "0.6"
networkkit = { path = "../NetworkKit" }
coreicon = { path = "../CoreIcon" }
coretext = { path = "../CoreText" }
foundation = { path = "../Foundation" }

# Settings daemon client (unix socket, TontooOS target only).
[target.'cfg(unix)'.dependencies]
coresettings = { path = "../CoreSettings" }

[lib]
crate-type = ["cdylib", "rlib"]
