[package]
name = "tontooui"
version = "26.1.0"
edition = "2021"
license = "TCL"
description = "SwiftUI-inspired declarative UI layer for TontooOS"
readme = "README.md"
keywords = ["tontoo", "ui", "swiftui", "declarative"]
categories = ["gui"]

[dependencies]
winit = "0.30"
wgpu = "29"
vello = "0.10"
parley = "0.11"
futures = "0.3"
png = "0.18"
coreicon = { path = "../CoreIcon" }

# Settings daemon client (unix socket, TontooOS target only).
[target.'cfg(unix)'.dependencies]
coresettings = { path = "../CoreSettings" }

[lib]
crate-type = ["cdylib", "rlib"]
